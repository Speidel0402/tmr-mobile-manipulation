name: hamburg-compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-offline-base.txt
      - name: Install Hamburg test dependencies
        run: python -m pip install -r requirements-offline-base.txt
      - name: Validate Hamburg deployment package
        run: |
          python -m unittest discover -s deploy/hamburg/tests -v
          python -m compileall -q deploy/hamburg
          python -m json.tool deploy/hamburg/config/venue.json >/dev/null
          python -m json.tool deploy/hamburg/config/interfaces-shanghai.json >/dev/null
          python -m json.tool deploy/hamburg/config/grasp-observation.json >/dev/null
          python -m json.tool deploy/hamburg/config/geometry-observations.json >/dev/null
          python deploy/hamburg/geometry_review.py >/dev/null
          python deploy/hamburg/hamburg_preflight.py --print-interface-only >/dev/null
          python deploy/hamburg/hamburg_grasp_check.py --object cup --plan >/dev/null
          python deploy/hamburg/hamburg_grasp_check.py --object bowl --plan >/dev/null
          python deploy/hamburg/hamburg_grasp_check.py --object plate --plan >/dev/null
          python deploy/hamburg/audit_submission.py \
            --output /tmp/tmr_task3_hamburg_source_audit.json >/dev/null

  arm64-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build Hamburg Humble image for Jetson host architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hamburg/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
